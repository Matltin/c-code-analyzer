name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test tools
        run: python -m pip install -e ".[dev]"
      - name: Compile package
        run: python -m compileall -q src
      - name: Run tests
        run: python -m pytest -q

  coverage:
    name: Coverage and HTML artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test tools
        run: python -m pip install -e ".[dev]"
      - name: Enforce coverage gate
        run: make coverage PY=python
      - name: Build syntax-highlight sample
        run: make highlight-html PY=python
      - name: Upload coverage reports
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov
          if-no-files-found: error
      - name: Upload syntax-highlight sample
        uses: actions/upload-artifact@v6
        with:
          name: syntax-highlight-sample
          path: output/highlight.html
          if-no-files-found: error
